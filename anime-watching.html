<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Watch Anime</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
    body { background: #000; color: white; }
    a { text-decoration: none; color: inherit; }
    .navbar {
      position: fixed; top: 0; left: 0; width: 100%;
      background: rgba(0,0,0,.95); padding: 12px 15px;
      display: flex; justify-content: space-between; align-items: center;
      border-bottom: 1px solid #222; z-index: 999;
    }
    .logo { color: #e50914; font-size: 24px; font-weight: bold; }
    .nav-links { display: flex; gap: 12px; font-size: 13px; overflow-x: auto; white-space: nowrap; }
    .nav-links a { color: #ccc; }
    .page { padding: 85px 20px 20px; }
    .player {
      width: 100%; height: 220px; background: #111;
      border: 1px solid #222; border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      color: #bbb; margin-bottom: 20px;
    }
    .title { font-size: 28px; margin-bottom: 10px; }
    .sub { color: #bbb; margin-bottom: 16px; }
    .desc { color: #ddd; line-height: 1.7; margin-bottom: 20px; }
    .ep-buttons { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; }
    .ep-btn {
      background: #111; border: 1px solid #333; color: white;
      padding: 10px 16px; border-radius: 8px;
    }
    .recommended h3 { margin-bottom: 12px; }
    .cards { display: flex; gap: 12px; overflow-x: auto; }
    .card {
      min-width: 150px; background: #111; border-radius: 10px;
      overflow: hidden; border: 1px solid #222;
    }
    .card img { width: 100%; height: 200px; object-fit: cover; display: block; }
    .card p { padding: 10px; font-size: 13px; }
  </style>
</head>
<body>

  <nav class="navbar">
    <div class="logo">NETFLIX</div>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="categories.html">Category</a>
      <a href="anime-details.html">Details</a>
      <a href="anime-watching.html">Watch</a>
      <a href="login.html">Login</a>
    </div>
  </nav>

  <div class="page">
    <div class="player">Video Player Area</div>

    <h1 class="title">Jujutsu Kaisen — Episode 1</h1>
    <div class="sub">Season 1 • Episode 1</div>
    <p class="desc">
      Yuji Itadori discovers the world of cursed energy and meets powerful sorcerers.
      This is your anime watch page layout.
    </p>

    <div class="ep-buttons">
      <button class="ep-btn">Episode 1</button>
      <button class="ep-btn">Episode 2</button>
      <button class="ep-btn">Episode 3</button>
      <button class="ep-btn">Episode 4</button>
    </div>

    <div class="recommended">
      <h3>More Anime</h3>
      <div class="cards">
        <a class="card" href="anime-details.html">
          <img src="https://wallpaperaccess.com/full/187161.jpg" alt="Demon Slayer">
          <p>Demon Slayer</p>
        </a>
        <a class="card" href="anime-details.html">
          <img src="https://wallpaperaccess.com/full/36626.jpg" alt="Attack on Titan">
          <p>Attack on Titan</p>
        </a>
        <a class="card" href="anime-details.html">
          <img src="https://wallpaperaccess.com/full/11724.jpg" alt="One Piece">
          <p>One Piece</p>
        </a>
      </div>
    </div>
  </div>

</body>
</html>
