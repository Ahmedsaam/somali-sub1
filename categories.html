<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Categories</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
    body { background: #000; color: white; }
    a { text-decoration: none; color: inherit; }
    .navbar {
      position: fixed; top: 0; left: 0; width: 100%;
      background: rgba(0,0,0,.95); padding: 12px 15px;
      display: flex; justify-content: space-between; align-items: center;
      border-bottom: 1px solid #222; z-index: 999;
    }
    .logo { color: #e50914; font-size: 24px; font-weight: bold; }
    .nav-links { display: flex; gap: 12px; font-size: 13px; overflow-x: auto; white-space: nowrap; }
    .nav-links a { color: #ccc; }
    .page { padding: 85px 20px 20px; }
    h1 { margin-bottom: 18px; }
    .grid {
      display: grid; grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }
    .card {
      background: #111; border: 1px solid #222; border-radius: 10px; overflow: hidden;
    }
    .card img { width: 100%; height: 190px; object-fit: cover; display: block; }
    .card-title { padding: 10px 10px 4px; font-weight: bold; }
    .card-sub { padding: 0 10px 10px; color: #aaa; font-size: 12px; }
  </style>
</head>
<body>

  <nav class="navbar">
    <div class="logo">NETFLIX</div>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="categories.html">Category</a>
      <a href="anime-details.html">Details</a>
      <a href="anime-watching.html">Watch</a>
      <a href="login.html">Login</a>
    </div>
  </nav>

  <div class="page">
    <h1>Anime Categories</h1>

    <div class="grid">
      <a class="card" href="anime-details.html">
        <img src="https://wallpaperaccess.com/full/1403207.jpg" alt="Jujutsu Kaisen">
        <div class="card-title">Action</div>
        <div class="card-sub">Jujutsu Kaisen</div>
      </a>

      <a class="card" href="anime-details.html">
        <img src="https://wallpaperaccess.com/full/187161.jpg" alt="Demon Slayer">
        <div class="card-title">Adventure</div>
        <div class="card-sub">Demon Slayer</div>
      </a>

      <a class="card" href="anime-details.html">
        <img src="https://wallpaperaccess.com/full/36626.jpg" alt="Attack on Titan">
        <div class="card-title">Drama</div>
        <div class="card-sub">Attack on Titan</div>
      </a>

      <a class="card" href="anime-details.html">
        <img src="https://wallpaperaccess.com/full/34623.jpg" alt="Naruto">
        <div class="card-title">Classic</div>
        <div class="card-sub">Naruto</div>
      </a>
    </div>
  </div>

</body>
</html>
