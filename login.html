<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
    body {
      background:
        linear-gradient(to top, rgba(0,0,0,.85), rgba(0,0,0,.55)),
        url('https://wallpaperaccess.com/full/1403207.jpg') center/cover no-repeat;
      min-height: 100vh; color: white;
    }
    a { text-decoration: none; color: inherit; }
    .navbar {
      padding: 20px; font-size: 28px; font-weight: bold; color: #e50914;
    }
    .wrap {
      display: flex; justify-content: center; align-items: center;
      padding: 20px;
    }
    .box {
      width: 100%; max-width: 360px; background: rgba(0,0,0,.82);
      padding: 25px; border-radius: 12px; border: 1px solid #222;
    }
    h1 { margin-bottom: 20px; }
    input {
      width: 100%; padding: 12px; margin-bottom: 12px;
      background: #111; border: 1px solid #333; border-radius: 8px; color: white;
    }
    button {
      width: 100%; padding: 12px; background: #e50914; color: white;
      border: none; border-radius: 8px; font-weight: bold; cursor: pointer;
      margin-top: 5px;
    }
    .back { margin-top: 16px; color: #bbb; font-size: 14px; text-align: center; }
  </style>
</head>
<body>

  <div class="navbar">NETFLIX</div>

  <div class="wrap">
    <div class="box">
      <h1>Login</h1>
      <input type="email" placeholder="Email" />
      <input type="password" placeholder="Password" />
      <button>Sign In</button>
      <div class="back"><a href="index.html">← Back to Home</a></div>
    </div>
  </div>

</body>
</html>
